# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

keymode=common
# reload config
bind=SUPER,r,reload_config
# terminal
bind=SUPER,t,spawn,kitty
bind=SUPER,Return,toggle_named_scratchpad,none,terminal,kitty -T terminal sh -c "fastfetch --logo-type kitty; exec $SHELL"

# exit
bind=SUPER+SHIFT,m,quit
bind=ALT,q,killclient,

# noctalia
bind=SUPER+CTRL,comma,spawn,noctalia msg settings-toggle
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER+CTRL,B,spawn,$HOME/.config/mango/scripts/bar-toggle.sh
bind=SUPER+SHIFT,Escape,spawn,noctalia msg panel-toggle session
bind=SUPER+CTRL,S,spawn,noctalia msg screenshot-region
bind=SUPER+CTRL+SHIFT,up,spawn,noctalia msg volume-up
bind=SUPER+CTRL+SHIFT,down,spawn,noctalia msg volume-down
bind=SUPER+CTRL+SHIFT,right,spawn,noctalia msg brightness-up
bind=SUPER+CTRL+SHIFT,left,spawn,noctalia msg brightness-down
bind=SUPER+CTRL,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+CTRL,W,spawn,noctalia msg panel-toggle wallpaper

# master stack
bind=SUPER,A,zoom

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER+CTRL,H,scroller_stack,left
bind=SUPER+CTRL,L,scroller_stack,right
bind=SUPER+CTRL,J,scroller_stack,down
bind=SUPER+CTRL,K,scroller_stack,up

keymode=default
# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,H, focus_window_or_workspace,left
bind=SUPER,L, focus_window_or_workspace,right
bind=SUPER,P, focuslast
bind=SUPER,K,spawn,$HOME/.config/mango/scripts/focus.sh K
bind=SUPER,J,spawn,$HOME/.config/mango/scripts/focus.sh J
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# switch workspace
bind=SUPER,bracketright,viewtoright,
bind=SUPER,bracketleft,viewtoleft,
bind=SUPER+shift,bracketleft,tagtoleft,0
bind=SUPER+shift,bracketright,tagtoright,0

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,L,exchange_client,right

# switch window status
bind=SUPER+ctrl,g,toggleglobal,
bind=ALT,Tab,overcircle,
bind=SUPER,o,togglejump,
bind=ALT,v,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,X,minimized,
bind=SUPER,C,centerwin,
bind=SUPER,V,restore_minimized
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER,S,toggle_scratchpad


#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout


bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=Alt+SHIFT,1,tagsilent,1
bind=Alt+SHIFT,2,tagsilent,2
bind=Alt+SHIFT,3,tagsilent,3
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
#bind=....,focusmon,left
#bind=.....,focusmon,right
#bind=.....,tagmon,left
#bind=......,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,G,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+SHIFT,minus,resizewin,+0,-50
bind=SUPER+SHIFT,equal,resizewin,+0,+50
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+Ctrl+alt,btn_right,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
mousebind=SUPER+Ctrl+alt,btn_left,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=SUPER+Ctrl+alt,up,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=SUPER+Ctrl+alt,down,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+ctrl,UP,viewtoleft
axisbind=SUPER+ctrl,DOWN,viewtoright
axisbind=SUPER+shift,UP,tagtoleft
axisbind=SUPER+shift,DOWN,tagtoright

# screenshot
bind=NONE,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh fullscreen
bind=SHIFT,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh region
bind=CTRL+SHIFT,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh window
bind=CTRL+SUPER,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze
bind=SHIFT+SUPER,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze-region
bind=CTRL,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh clipboard
bind=SUPER,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh annotate

# File manager
bind=SUPER,e,toggle_named_scratchpad,none,yazi,kitty -T yazi-8hashjwhjsjiozxd3# -e yazi

# Group
bind=SUPER+alt,h,groupjoin,left
bind=SUPER+alt,j,groupjoin,down
bind=SUPER+alt,k,groupjoin,up
bind=SUPER+alt,l,groupjoin,right
bind=SUPER+alt,U,groupleave
bind=SUPER,i,groupfocus,next
bind=SUPER,u,groupfocus,prev

# border
bind=SUPER,b,toggle_render_border
